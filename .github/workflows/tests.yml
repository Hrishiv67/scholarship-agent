name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python tests/test_profile_loader.py
          python tests/test_dedup.py
          python tests/test_captcha.py
          python tests/test_form_filler.py
          python tests/test_page_solver.py
          python tests/test_searcher.py
