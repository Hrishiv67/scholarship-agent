name: Deploy calendar website

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'outputs/calendar.html'
      - 'outputs/calendar.ics'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site folder
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/calendar.ics _site/calendar.ics 2>/dev/null || cp outputs/calendar.ics _site/calendar.ics
          echo "Site files:"
          ls -la _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
