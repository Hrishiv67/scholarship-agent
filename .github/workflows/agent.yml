name: Scholarship Agent

# Auto-apply is retired. The weekly job is Calendar Refresh.
on:
  workflow_dispatch:
    inputs:
      notice:
        description: 'This workflow no longer applies. Use Actions → Calendar Refresh.'
        required: false
        default: 'retired'

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-apply is retired
        run: |
          echo "The apply agent is retired."
          echo "Use the Calendar Refresh workflow to find programs and confirm due dates."
          echo "Calendar is split into AI, Engineering, and Business."
