name: Calendar Refresh

on:
  schedule:
    # Every Monday at 9:00 AM ET (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      research_limit:
        description: 'Programs to research (0 = all)'
        required: false
        default: '0'

concurrency:
  group: outputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run calendar tests
        run: python tests/test_calendar.py

  refresh-calendar:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Verify required secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is empty"; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "TAVILY_API_KEY secret is empty"; exit 1; }
          echo "Required API keys are present"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deep research — find programs and confirm dates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEARCH_LIMIT: ${{ github.event.inputs.research_limit || '0' }}
          DISCOVER_LIMIT: '30'
          DEEP_RESEARCH: '1'
          TAVILY_DEPTH: 'advanced'
          PYTHONUNBUFFERED: '1'
        run: python -m calendar_agent

      - name: Commit calendar
        if: always()
        run: |
          git config user.name "scholarship-agent[bot]"
          git config user.email "scholarship-agent@noreply.github.com"
          git add outputs/program_calendar.json outputs/CALENDAR.md outputs/calendar.ics outputs/calendar.html outputs/WEEKLY_DIGEST.md outputs/program_research/ calendar_agent/programs.json docs/index.html docs/calendar.ics || true
          if git diff --staged --quiet; then
            echo "No calendar changes to commit"
            exit 0
          fi
          git commit -m "calendar: weekly refresh $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push

  deploy-site:
    needs: refresh-calendar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/calendar.ics _site/calendar.ics
          ls -la _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
